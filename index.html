<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuGöl Hikayeler | Sesli Kitaplık</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- VERİ KAYNAKLARI -->
    <script src="hikaye-kayit.js"></script>
    <script src="kitaplar.js"></script>
    <script src="hikaye1.js"></script>
    <script src="hikaye2.js"></script>

    <style>
        :root {
            --bg-base: #f0ebe3;
            --bg-card: #faf8f4;
            --bg-card2: #fff;
            --primary: #1a1410;
            --primary-light: #3d2b1f;
            --accent: #c2622d;
            --accent2: #e8956d;
            --accent-gold: #d4a843;
            --text-dark: #1a1410;
            --text-mid: #4a3728;
            --text-light: #8a7060;
            --border-color: rgba(194, 98, 45, 0.18);
            --shadow-sm: 0 4px 24px rgba(60,30,10,0.08);
            --shadow-md: 0 12px 40px rgba(60,30,10,0.13);
            --border-radius: 22px;
            --sidebar-bg: #1a1410;
            --sidebar-text: #f0ebe3;
            --progress-bg: rgba(60,30,10,0.08);
            --header-bg: linear-gradient(135deg, #1a1410 0%, #3d2b1f 100%);
        }

        [data-theme="dark"] {
            --bg-base: #0d0b09;
            --bg-card: #1a1410;
            --bg-card2: #231d17;
            --primary: #f0ebe3;
            --primary-light: #d4c4b0;
            --text-dark: #f0ebe3;
            --text-mid: #c4a882;
            --text-light: #8a7060;
            --border-color: rgba(212, 168, 67, 0.2);
            --shadow-sm: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-md: 0 12px 40px rgba(0,0,0,0.4);
            --progress-bg: rgba(255,255,255,0.06);
            --header-bg: linear-gradient(135deg, #0d0b09 0%, #1a1410 100%);
        }

        [data-theme="sepia"] {
            --bg-base: #efe8d8;
            --bg-card: #f9f4e8;
            --bg-card2: #fff9ed;
            --text-dark: #3d2b1f;
            --text-mid: #6b4f3a;
            --text-light: #9a7b5e;
            --accent: #7c4a1e;
            --accent2: #b06b3a;
            --accent-gold: #b8922a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-dark);
            transition: background 0.4s, color 0.4s;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Grain texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.5;
        }

        /* ═══════════════════ HEADER ═══════════════════ */
        header {
            background: var(--header-bg);
            color: #fff;
            border-bottom: 3px solid var(--accent);
            padding: 0.9rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.25);
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.35rem;
            color: var(--accent2);
            letter-spacing: 0.02em;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent-gold));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 4px 12px rgba(194,98,45,0.4);
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 380px;
            margin: 0 20px;
        }

        .search-container input {
            width: 100%;
            padding: 9px 15px 9px 38px;
            border-radius: 50px;
            border: 1.5px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.08);
            color: #fff;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .search-container input::placeholder { color: rgba(255,255,255,0.4); }
        .search-container input:focus { background: rgba(255,255,255,0.15); border-color: var(--accent2); }
        .search-container i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--accent2); font-size: 0.85rem; }

        .icon-btn {
            font-size: 1rem;
            color: var(--accent2);
            cursor: pointer;
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(232,149,109,0.25);
            border-radius: 12px;
            width: 42px;
            height: 42px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(194,98,45,0.35);
        }

        /* Header stats strip */
        .stats-bar {
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-gold) 100%);
            padding: 6px 1.8rem;
            display: flex;
            gap: 2rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stats-bar span { display: flex; align-items: center; gap: 5px; }

        /* ═══════════════════ SIDEBARS ═══════════════════ */
        .sidebar {
            position: fixed;
            top: 0;
            width: 290px;
            height: 100%;
            z-index: 4001;
            transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
            overflow-y: auto;
        }

        .sidebar.left {
            left: -310px;
            background: var(--sidebar-bg);
            border-right: 3px solid var(--accent);
            box-shadow: 6px 0 40px rgba(0,0,0,0.3);
        }

        .sidebar.right {
            right: -310px;
            background: var(--bg-card2);
            border-left: 3px solid var(--accent);
            box-shadow: -6px 0 40px rgba(0,0,0,0.15);
        }

        .sidebar.open { left: 0 !important; }
        .sidebar.right.open { right: 0 !important; left: auto !important; }

        .sidebar-header {
            padding: 1.4rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar.right .sidebar-header { border-bottom-color: var(--border-color); }

        .side-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent2);
        }

        .sidebar.right .side-title { color: var(--accent); }

        .close-sidebar {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            transition: 0.2s;
        }

        .close-sidebar:hover { color: var(--accent2); }
        .sidebar.right .close-sidebar { color: var(--text-light); }
        .sidebar.right .close-sidebar:hover { color: var(--accent); }

        .side-list { list-style: none; padding: 1rem; }

        .side-item {
            padding: 11px 14px;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(240,235,227,0.7);
        }

        .side-item i { width: 18px; text-align: center; font-size: 0.85rem; }
        .side-item:hover { background: rgba(232,149,109,0.15); color: var(--accent2); }
        .side-item.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; box-shadow: 0 4px 16px rgba(194,98,45,0.35); }

        /* ═══════════════════ HERO / FEATURED ═══════════════════ */
        .hero-section {
            max-width: 1240px;
            margin: 2.5rem auto 0;
            padding: 0 1.5rem;
        }

        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* ═══════════════════ GRID ═══════════════════ */
        .container {
            max-width: 1240px;
            margin: 2rem auto 4rem;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 60%, rgba(194,98,45,0.04) 100%);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .card-color-strip {
            height: 5px;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
        }

        .card-body { padding: 1.8rem; display: flex; flex-direction: column; flex: 1; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }

        .card-badge {
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(194,98,45,0.1);
            padding: 5px 12px;
            border-radius: 50px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid rgba(194,98,45,0.2);
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.3s;
            padding: 4px 6px;
            border-radius: 8px;
        }

        .fav-btn:hover { background: rgba(212,168,67,0.12); color: var(--accent-gold); transform: scale(1.15); }
        .fav-btn.faved { color: var(--accent-gold); }
        .fav-btn.faved i { filter: drop-shadow(0 2px 6px rgba(212,168,67,0.5)); }

        /* Kaldığın yer banner */
        .resume-banner {
            max-width: 1240px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
        }

        .resume-card {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-gold) 100%);
            border-radius: 16px;
            padding: 1rem 1.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 6px 24px rgba(194,98,45,0.25);
            animation: cardEnter 0.5s ease both;
        }

        .resume-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }

        .resume-icon {
            width: 42px; height: 42px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: white; flex-shrink: 0;
        }

        .resume-text { min-width: 0; }
        .resume-label { font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 0.1em; }
        .resume-title { font-family: 'Playfair Display', serif; font-weight: 800; color: white; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .resume-pct { font-size: 0.78rem; color: rgba(255,255,255,0.8); font-weight: 600; }

        .resume-btn {
            background: rgba(255,255,255,0.2);
            border: 1.5px solid rgba(255,255,255,0.35);
            color: white;
            padding: 9px 18px;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .resume-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }

        .resume-close {
            background: none; border: none; color: rgba(255,255,255,0.6);
            cursor: pointer; font-size: 1rem; padding: 4px; transition: 0.2s;
            flex-shrink: 0;
        }
        .resume-close:hover { color: white; }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.55rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-dark);
            margin-bottom: 0.8rem;
        }

        .card-excerpt {
            font-size: 0.88rem;
            color: var(--text-light);
            line-height: 1.65;
            margin-bottom: 1.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.78rem;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 1.4rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .card-stats span { display: flex; align-items: center; gap: 5px; }

        /* Progress bar on card */
        .card-progress {
            height: 3px;
            background: var(--progress-bg);
            border-radius: 3px;
            margin-bottom: 1.2rem;
            overflow: hidden;
        }

        .card-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            border-radius: 3px;
            transition: width 0.5s;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #f0ebe3;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: auto;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }

        .btn-main:hover {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(194,98,45,0.3);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-light);
        }

        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
        .empty-state p { font-size: 1.1rem; }

        /* ═══════════════════ OVERLAY ═══════════════════ */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,8,6,0.6);
            z-index: 3500;
            display: none;
            backdrop-filter: blur(6px);
        }
        .overlay.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ═══════════════════ READER ═══════════════════ */
        .reader {
            position: fixed;
            inset: 0;
            background: var(--bg-card);
            z-index: 3000;
            display: none;
            flex-direction: column;
        }

        .reader.open {
            display: flex;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .progress-line {
            position: relative;
            width: 100%;
            height: 5px;
            background: var(--progress-bg);
            cursor: pointer;
            flex-shrink: 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            width: 0%;
            transition: width 0.4s;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -3.5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 8px rgba(212,168,67,0.6);
        }

        .reader-nav {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            transition: 0.4s;
            flex-shrink: 0;
            gap: 12px;
        }

        .reader.focus .reader-nav, .reader.focus .player-bar { opacity: 0; pointer-events: none; }

        .nav-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
            flex: 1;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reader-content {
            flex: 1;
            overflow-y: auto;
            padding: 3.5rem 1.5rem;
            scroll-behavior: smooth;
        }

        .text-well {
            max-width: 720px;
            margin: 0 auto;
            line-height: 2;
            font-size: 1.35rem;
            color: var(--text-dark);
        }

        .story-title-reader {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: 800;
            line-height: 1.25;
            font-size: 2.2rem;
            color: var(--text-dark);
        }

        .story-title-reader::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            margin: 1.2rem auto 0;
            border-radius: 3px;
        }

        .sentence {
            transition: all 0.25s;
            padding: 3px 6px;
            border-radius: 6px;
            cursor: pointer;
            display: inline;
        }

        .sentence:hover { background: rgba(194,98,45,0.1); }

        .sentence.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 16px rgba(194,98,45,0.35);
        }

        /* ═══════════════════ PLAYER BAR ═══════════════════ */
        .player-bar {
            background: var(--bg-card2);
            padding: 1.2rem 2rem;
            border-top: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            transition: 0.4s;
            flex-shrink: 0;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .player-controls .icon-btn {
            background: var(--progress-bg);
            border-color: var(--border-color);
            color: var(--text-mid);
        }

        .btn-play-big {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(194,98,45,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play-big:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(194,98,45,0.5);
        }

        .btn-play-big.playing { animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 6px 24px rgba(194,98,45,0.4); }
            50% { box-shadow: 0 6px 36px rgba(194,98,45,0.7); }
        }

        .sentence-counter {
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-light);
            letter-spacing: 0.06em;
        }

        .sentence-counter span { color: var(--accent); }

        /* ═══════════════════ SETTINGS PANEL ═══════════════════ */
        .settings-content { padding: 1.2rem 1.5rem; }

        .setting-item { margin-bottom: 1.5rem; }

        .setting-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .theme-btn {
            padding: 10px 6px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-base);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-mid);
            transition: all 0.25s;
            font-family: 'DM Sans', sans-serif;
            text-align: center;
        }

        .theme-btn:hover, .theme-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(194,98,45,0.08);
        }

        .select-ui {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-base);
            color: var(--text-dark);
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            outline: none;
            transition: 0.25s;
        }

        .select-ui:focus { border-color: var(--accent); }

        .font-controls { display: flex; gap: 8px; }

        .font-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-base);
            color: var(--text-dark);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.25s;
        }

        .font-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-base);
            margin-bottom: 8px;
        }

        .toggle-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-mid);
        }

        .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.1);
            transition: 0.35s;
            border-radius: 22px;
            border: 1.5px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 15px;
            width: 15px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.35s;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* ═══════════════════ TOAST ═══════════════════ */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--primary);
            color: var(--bg-base);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 9000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ═══════════════════ SCROLLBAR ═══════════════════ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(194,98,45,0.3); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ═══════════════════ RESPONSIVE ═══════════════════ */
        @media (max-width: 600px) {
            header { padding: 0.8rem 1rem; }
            .header-brand span { display: none; }
            .search-container { max-width: 200px; margin: 0 10px; }
            .container { grid-template-columns: 1fr; gap: 1.2rem; padding: 0 1rem; }
            .stats-bar { gap: 1rem; font-size: 0.67rem; flex-wrap: wrap; }
        }

        /* Card enter animation */
        .card { animation: cardEnter 0.4s ease both; }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="icon-btn" onclick="toggleSidebar('left')" title="Kategoriler">
                <i class="fas fa-bars"></i>
            </button>
            <div class="header-brand">
                <img src="logo.png" alt="MuGöl Logo" style="width:52px;height:52px;object-fit:contain;border-radius:12px;">
                <span>MuGöl Hikayeler</span>
            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Hikaye ara..." oninput="render()">
        </div>

        <button class="icon-btn" onclick="toggleSidebar('right')" title="Ayarlar">
            <i class="fas fa-sliders-h"></i>
        </button>
    </header>

    <div class="stats-bar" id="statsBar">
        <span><i class="fas fa-book-open"></i> <span id="totalCount">0</span> Hikaye</span>
        <span><i class="fas fa-bookmark"></i> <span id="favCount">0</span> Favori</span>
        <span><i class="fas fa-check-circle"></i> <span id="readCount">0</span> Okundu</span>
    </div>

    <!-- SOL MENÜ - Kategoriler -->
    <nav class="sidebar left" id="leftSidebar">
        <div class="sidebar-header">
            <span class="side-title">📚 Kategoriler</span>
            <button class="close-sidebar" onclick="closeSidebars()"><i class="fas fa-times"></i></button>
        </div>
        <ul class="side-list" id="catMenu">
            <li class="side-item active" onclick="filterBy('all', this)">
                <i class="fas fa-border-all"></i> Tüm Hikayeler
            </li>
            <li class="side-item" onclick="filterBy('favorites', this)">
                <i class="fas fa-bookmark"></i> Favorilerim
            </li>
        </ul>
    </nav>

    <!-- SAĞ MENÜ - Ayarlar -->
    <nav class="sidebar right" id="rightSidebar">
        <div class="sidebar-header">
            <span class="side-title" style="color:var(--accent)">⚙️ Ayarlar</span>
            <button class="close-sidebar" style="color:var(--text-light)" onclick="closeSidebars()"><i class="fas fa-times"></i></button>
        </div>
        <div class="settings-content">

            <div class="setting-item">
                <div class="setting-label">Tema</div>
                <div class="theme-grid">
                    <button class="theme-btn active" onclick="setTheme('light', this)"><i class="fas fa-sun"></i><br>Aydınlık</button>
                    <button class="theme-btn" onclick="setTheme('sepia', this)"><i class="fas fa-coffee"></i><br>Sepya</button>
                    <button class="theme-btn" onclick="setTheme('dark', this)"><i class="fas fa-moon"></i><br>Karanlık</button>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-label">Okuyucu Sesi</div>
                <select id="voiceSelect" class="select-ui" onchange="saveVoicePref()"><option>Ses yükleniyor...</option></select>
                <button class="font-btn" style="width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;" onclick="previewVoice()">
                    <i class="fas fa-volume-up"></i> Sesi Dene
                </button>
            </div>

            <div class="setting-item">
                <div class="setting-label" style="display:flex;justify-content:space-between;align-items:center;">
                    <span>Ses Tonu</span>
                    <span id="pitchVal" style="color:var(--accent);font-weight:700">1.0</span>
                </div>
                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1"
                    oninput="updatePitch(this.value)"
                    style="width:100%;accent-color:var(--accent);cursor:pointer;height:6px;border-radius:6px;margin-top:8px;">
                <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--text-light);margin-top:4px;">
                    <span>Kalın</span><span>Normal</span><span>İnce</span>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-label">Okuma Hızı</div>
                <select id="speedSelect" class="select-ui">
                    <option value="0.7">0.7× — Çok Yavaş</option>
                    <option value="0.9">0.9× — Yavaş</option>
                    <option value="1" selected>1.0× — Normal</option>
                    <option value="1.2">1.2× — Hızlı</option>
                    <option value="1.5">1.5× — Çok Hızlı</option>
                </select>
            </div>

            <div class="setting-item">
                <div class="setting-label">Yazı Boyutu</div>
                <div class="font-controls">
                    <button class="font-btn" onclick="adjFont(-2)"><i class="fas fa-minus"></i> Küçült</button>
                    <button class="font-btn" onclick="adjFont(0)"><i class="fas fa-redo"></i></button>
                    <button class="font-btn" onclick="adjFont(2)"><i class="fas fa-plus"></i> Büyüt</button>
                </div>
            </div>

            <div class="setting-item">
                <div class="toggle-row">
                    <span class="toggle-label"><i class="fas fa-eye-slash" style="margin-right:8px;color:var(--accent)"></i>Odak Modu</span>
                    <label class="switch"><input type="checkbox" id="focusToggle" onchange="toggleFocusMode()"><span class="slider"></span></label>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label"><i class="fas fa-scroll" style="margin-right:8px;color:var(--accent)"></i>Otomatik Kaydır</span>
                    <label class="switch"><input type="checkbox" id="scrollToggle" checked><span class="slider"></span></label>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label"><i class="fas fa-redo" style="margin-right:8px;color:var(--accent)"></i>Döngü Modu</span>
                    <label class="switch"><input type="checkbox" id="loopToggle"><span class="slider"></span></label>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-label">Veri Dosyası</div>
                <button class="font-btn" style="width:100%; gap:8px; display:flex; align-items:center; justify-content:center;" onclick="downloadKayitJs()">
                    <i class="fas fa-download"></i> hikaye-kayit.js İndir
                </button>
            </div>

        </div>
    </nav>

    <div class="overlay" id="overlay" onclick="closeSidebars()"></div>

    <!-- KALDĞIN YER BANNER -->
    <div class="resume-banner" id="resumeBanner" style="display:none"></div>

    <!-- KART IZGARASI -->
    <main class="container" id="storyGrid"></main>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- OKUYUCU -->
    <div class="reader" id="reader">
        <div class="progress-line" onclick="seekStory(event)">
            <div class="progress-fill" id="pFill"></div>
        </div>
        <nav class="reader-nav">
            <button class="icon-btn" onclick="closeReader()" title="Geri">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="nav-title" id="navTitle">Okunuyor...</div>
            <button class="icon-btn" onclick="toggleSidebar('right')" title="Ayarlar">
                <i class="fas fa-sliders-h"></i>
            </button>
        </nav>

        <div class="reader-content" id="rScrollCont">
            <div class="text-well" id="textWell">
                <h1 class="story-title-reader" id="rTitle"></h1>
                <div id="rBody"></div>
            </div>
        </div>

        <div class="player-bar">
            <div class="player-controls">
                <button class="icon-btn" onclick="skip(-5)" title="-5 Cümle"><i class="fas fa-backward"></i></button>
                <button class="icon-btn" onclick="skip(-1)" title="Önceki"><i class="fas fa-step-backward"></i></button>
                <button class="btn-play-big" id="playBtn" onclick="togglePlay()" title="Oynat / Durdur">
                    <i class="fas fa-play"></i>
                </button>
                <button class="icon-btn" onclick="skip(1)" title="Sonraki"><i class="fas fa-step-forward"></i></button>
                <button class="icon-btn" onclick="skip(5)" title="+5 Cümle"><i class="fas fa-forward"></i></button>
            </div>
            <div style="display:flex;align-items:center;gap:1rem;">
                <div class="sentence-counter">
                    CÜMLE <span id="curS">0</span> / <span id="totS">0</span>
                </div>
                <button class="icon-btn" id="loopBtn" onclick="toggleLoopBtn()" title="Döngü Modu"
                    style="width:34px;height:34px;font-size:0.8rem;background:var(--progress-bg);border-color:var(--border-color);color:var(--text-light);">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ──────────────── STATE ────────────────
        const grid = document.getElementById('storyGrid');
        let sentences = [], sIdx = 0, isPlaying = false;
        let fontSz = MuGolKayit.settings.getFontSize();
        let activeCat = 'all';
        let currentStoryId = null;
        const synth = window.speechSynthesis;
        let voices = [];

        // ──────────────── VOICES ────────────────
        function loadVoices() {
            const all = synth.getVoices();
            voices = all.filter(v => v.lang.includes('tr'));
            if (!voices.length) voices = all;
            const saved = parseInt(localStorage.getItem('mugol_voiceIdx') || '0');
            const opts = voices.map((v, i) => `<option value="${i}"${i===saved?' selected':''}>${v.name} (${v.lang})</option>`).join('');
            document.getElementById('voiceSelect').innerHTML = opts;
            // Restore saved speed & pitch
            const spd = MuGolKayit.settings.getSpeed();
            document.getElementById('speedSelect').value = spd;
            const pitch = parseFloat(localStorage.getItem('mugol_pitch') || '1');
            document.getElementById('pitchSlider').value = pitch;
            document.getElementById('pitchVal').textContent = pitch.toFixed(1);
        }

        function saveVoicePref() {
            localStorage.setItem('mugol_voiceIdx', document.getElementById('voiceSelect').value);
        }

        function previewVoice() {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance('Merhaba! Bu ses önizlemesidir.');
            const vIdx = document.getElementById('voiceSelect').value;
            if (voices[vIdx]) utter.voice = voices[vIdx];
            utter.rate = parseFloat(document.getElementById('speedSelect').value);
            utter.pitch = parseFloat(document.getElementById('pitchSlider').value);
            utter.lang = 'tr-TR';
            synth.speak(utter);
        }

        function updatePitch(val) {
            document.getElementById('pitchVal').textContent = parseFloat(val).toFixed(1);
            localStorage.setItem('mugol_pitch', val);
        }

        function toggleLoopBtn() {
            const loopToggle = document.getElementById('loopToggle');
            loopToggle.checked = !loopToggle.checked;
            const btn = document.getElementById('loopBtn');
            if (loopToggle.checked) {
                btn.style.background = 'var(--accent)';
                btn.style.color = '#fff';
                btn.style.borderColor = 'var(--accent)';
                showToast('🔁 Döngü modu açık');
            } else {
                btn.style.background = 'var(--progress-bg)';
                btn.style.color = 'var(--text-light)';
                btn.style.borderColor = 'var(--border-color)';
                showToast('Döngü modu kapalı');
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        setTimeout(loadVoices, 500);

        // ──────────────── INIT ────────────────
        function init() {
            loadVoices();
            const categories = new Set();
            kitapListesi.forEach(file => {
                const id = file.replace('.js', '');
                const data = window['story_' + id];
                if (data && data.category) categories.add(data.category);
            });

            const menu = document.getElementById('catMenu');
            // Ayırıcı
            const sep = document.createElement('li');
            sep.style.cssText = 'height:1px;background:rgba(255,255,255,0.07);margin:8px 14px;';
            menu.appendChild(sep);

            categories.forEach(cat => {
                const li = document.createElement('li');
                li.className = 'side-item';
                li.innerHTML = `<i class="fas fa-hashtag"></i> ${cat}`;
                li.onclick = () => filterBy(cat, li);
                menu.appendChild(li);
            });

            restoreTheme();
            showResumeBanner();
            render();
            updateStatsBar();
        }

        // ──────────────── KALDĞIN YER BANNER ────────────────
        function showResumeBanner() {
            const allProg = MuGolKayit.progress.getAll();
            // %5–99 arasında kalan hikayeleri bul, en son güncellenen
            const candidates = kitapListesi
                .map(f => f.replace('.js', ''))
                .filter(id => {
                    const pct = allProg[id] || 0;
                    return pct >= 5 && pct < 99 && window['story_' + id];
                })
                .sort((a, b) => (allProg[b] || 0) - (allProg[a] || 0)); // en yüksek ilerleme önce

            const banner = document.getElementById('resumeBanner');
            if (!candidates.length) { banner.style.display = 'none'; return; }

            const id = candidates[0];
            const data = window['story_' + id];
            const pct = allProg[id];

            banner.style.display = 'block';
            banner.innerHTML = `
                <div class="resume-card">
                    <div class="resume-info">
                        <div class="resume-icon"><i class="fas fa-book-reader"></i></div>
                        <div class="resume-text">
                            <div class="resume-label">Kaldığın Yer</div>
                            <div class="resume-title">${data.title}</div>
                            <div class="resume-pct"><i class="fas fa-circle-notch"></i> %${pct} tamamlandı</div>
                        </div>
                    </div>
                    <button class="resume-btn" onclick="openReader('${id}')">
                        <i class="fas fa-play"></i> Devam Et
                    </button>
                    <button class="resume-close" onclick="dismissResume('${id}')" title="Kapat">
                        <i class="fas fa-times"></i>
                    </button>
                </div>`;
        }

        function dismissResume(id) {
            // İlerlemeyi sıfırlamaz, sadece banner'ı gizler (sayfayı yenilersen tekrar çıkar; tam resetlemek için progress sıfırla)
            document.getElementById('resumeBanner').style.display = 'none';
        }

        // ──────────────── RENDER ────────────────
        function render() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            let count = 0;
            const favIds = MuGolKayit.favorites.ids();

            let listToRender = kitapListesi.map(f => f.replace('.js', ''));

            // Favoriler filtresi
            if (activeCat === 'favorites') {
                listToRender = favIds.filter(id => window['story_' + id]);
            }

            listToRender.forEach((id, idx) => {
                const data = window['story_' + id];
                if (!data) return;
                if (activeCat !== 'all' && activeCat !== 'favorites' && data.category !== activeCat) return;
                if (!data.title.toLowerCase().includes(q)) return;

                count++;
                const wordCount = data.content.split(/\s+/).length;
                const readTime = Math.ceil(wordCount / 180);
                const pct = MuGolKayit.progress.get(id);
                const isRead = MuGolKayit.read.is(id);
                const isFav = MuGolKayit.favorites.is(id);
                const excerpt = data.content.substring(0, 120) + '…';

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = (idx * 0.06) + 's';
                card.innerHTML = `
                    <div class="card-color-strip"></div>
                    <div class="card-body">
                        <div class="card-top">
                            <span class="card-badge">${data.category || 'Genel'}</span>
                            <button class="fav-btn ${isFav ? 'faved' : ''}" onclick="toggleFav(event, '${id}')" title="${isFav ? 'Favoriden çıkar' : 'Favorilere ekle'}">
                                <i class="${isFav ? 'fas' : 'far'} fa-bookmark"></i>
                            </button>
                        </div>
                        <h2 class="card-title">${data.title}</h2>
                        <p class="card-excerpt">${excerpt}</p>
                        ${pct > 0 && pct < 99 ? `
                            <div class="card-progress" title="%${pct} okundu">
                                <div class="card-progress-fill" style="width:${pct}%"></div>
                            </div>` : ''}
                        <div class="card-stats">
                            <span><i class="fas fa-align-left"></i> ${wordCount} kelime</span>
                            <span><i class="far fa-clock"></i> ~${readTime} dk</span>
                            ${isRead ? '<span style="color:var(--accent)"><i class="fas fa-check-circle"></i> Okundu</span>' : ''}
                        </div>
                        <button class="btn-main" onclick="openReader('${id}')">
                            <i class="fas fa-${pct > 0 && pct < 99 ? 'redo' : 'book-open'}"></i>
                            ${pct > 0 && pct < 99 ? 'Kaldığım Yerden Devam' : 'Oku & Dinle'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (count === 0) {
                const emptyMsg = activeCat === 'favorites'
                    ? '<i class="fas fa-bookmark"></i><p>Henüz favori eklemediniz.<br><small>Hikaye kartlarındaki 🔖 simgesine tıklayın.</small></p>'
                    : '<i class="fas fa-search"></i><p>Arama sonucu bulunamadı.</p>';
                grid.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
            }

            document.getElementById('totalCount').innerText = count;
        }

        // ──────────────── FAVORİ ────────────────
        function toggleFav(e, id) {
            e.stopPropagation();
            const nowFav = MuGolKayit.favorites.toggle(id);
            render();
            updateStatsBar();
            showToast(nowFav ? '🔖 Favorilere eklendi!' : '📌 Favorilerden çıkarıldı');
        }

        // ──────────────── STATS BAR ────────────────
        function updateStatsBar() {
            document.getElementById('favCount').innerText = MuGolKayit.favorites.count();
            document.getElementById('readCount').innerText = MuGolKayit.read.count();
        }

        // ──────────────── READER ────────────────
        function openReader(id) {
            const data = window['story_' + id];
            currentStoryId = id;
            document.getElementById('rTitle').innerText = data.title;
            document.getElementById('navTitle').innerText = data.title;

            sentences = data.content.match(/[^.!?]+[.!?]+/g) || [data.content];

            // Kaldığın yerden devam
            const savedPct = MuGolKayit.progress.get(id);
            sIdx = savedPct ? Math.max(0, Math.floor((savedPct / 100) * sentences.length) - 1) : 0;

            document.getElementById('rBody').innerHTML = sentences.map((s, i) =>
                `<span class="sentence" id="s-${i}" onclick="jumpTo(${i})">${s}</span>`
            ).join(' ');

            document.getElementById('totS').innerText = sentences.length;
            document.getElementById('textWell').style.fontSize = fontSz + 'px';
            document.getElementById('reader').classList.add('open');
            document.body.style.overflow = 'hidden';

            // Favori butonu güncelle
            updateReaderFavBtn();
            updateUI();
        }

        function updateReaderFavBtn() {
            const btn = document.getElementById('readerFavBtn');
            if (!btn || !currentStoryId) return;
            const isFav = MuGolKayit.favorites.is(currentStoryId);
            btn.innerHTML = `<i class="${isFav ? 'fas' : 'far'} fa-bookmark"></i>`;
            btn.title = isFav ? 'Favoriden çıkar' : 'Favorilere ekle';
            btn.classList.toggle('fav-active', isFav);
        }

        function updateUI() {
            document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active'));
            const active = document.getElementById(`s-${sIdx}`);
            if (active) {
                active.classList.add('active');
                if (document.getElementById('scrollToggle').checked) {
                    active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            const pct = ((sIdx + 1) / sentences.length) * 100;
            document.getElementById('pFill').style.width = pct + '%';
            document.getElementById('curS').innerText = sIdx + 1;

            // İlerlemeyi kaydet
            if (currentStoryId) {
                MuGolKayit.progress.save(currentStoryId, pct);

                if (pct > 90 && !MuGolKayit.read.is(currentStoryId)) {
                    MuGolKayit.read.mark(currentStoryId);
                    updateStatsBar();
                    showToast('🎉 Hikaye tamamlandı!');
                }
            }
        }

        function togglePlay() {
            if (isPlaying) {
                synth.cancel();
                isPlaying = false;
                document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
                document.getElementById('playBtn').classList.remove('playing');
            } else {
                isPlaying = true;
                document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
                document.getElementById('playBtn').classList.add('playing');
                startTTS();
            }
        }

        function startTTS() {
            if (!isPlaying || sIdx >= sentences.length) {
                if (isPlaying) {
                    const loop = document.getElementById('loopToggle').checked;
                    if (loop) {
                        sIdx = 0;
                        updateUI();
                        startTTS();
                    } else {
                        togglePlay();
                    }
                }
                return;
            }
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(sentences[sIdx]);
            const vIdx = document.getElementById('voiceSelect').value;
            if (voices[vIdx]) utter.voice = voices[vIdx];
            const spd = parseFloat(document.getElementById('speedSelect').value);
            utter.rate = spd;
            utter.pitch = parseFloat(document.getElementById('pitchSlider').value);
            utter.lang = 'tr-TR';
            MuGolKayit.settings.saveSpeed(spd);
            utter.onend = () => {
                if (isPlaying) {
                    sIdx++;
                    if (sIdx < sentences.length) { updateUI(); startTTS(); }
                    else {
                        const loop = document.getElementById('loopToggle').checked;
                        if (loop) { sIdx = 0; updateUI(); startTTS(); }
                        else togglePlay();
                    }
                }
            };
            synth.speak(utter);
        }

        function seekStory(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            sIdx = Math.max(0, Math.min(Math.floor(pct * sentences.length), sentences.length - 1));
            updateUI();
            if (isPlaying) startTTS();
        }

        function skip(dir) {
            sIdx = Math.max(0, Math.min(sIdx + dir, sentences.length - 1));
            updateUI();
            if (isPlaying) startTTS();
        }

        function jumpTo(i) {
            sIdx = i;
            updateUI();
            if (isPlaying) startTTS();
        }

        function closeReader() {
            synth.cancel();
            isPlaying = false;
            document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
            document.getElementById('playBtn').classList.remove('playing');
            document.getElementById('reader').classList.remove('open', 'focus');
            document.getElementById('focusToggle').checked = false;
            document.body.style.overflow = 'auto';
            showResumeBanner();
            render();
        }

        // ──────────────── SIDEBARS ────────────────
        function toggleSidebar(side) {
            const left = document.getElementById('leftSidebar');
            const right = document.getElementById('rightSidebar');
            const overlay = document.getElementById('overlay');
            if (side === 'left') { left.classList.toggle('open'); right.classList.remove('open'); }
            else { right.classList.toggle('open'); left.classList.remove('open'); }
            const anyOpen = left.classList.contains('open') || right.classList.contains('open');
            overlay.classList.toggle('active', anyOpen);
        }

        function closeSidebars() {
            document.getElementById('leftSidebar').classList.remove('open');
            document.getElementById('rightSidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        // ──────────────── UTILS ────────────────
        function toggleFocusMode() {
            document.getElementById('reader').classList.toggle('focus');
        }

        function filterBy(cat, el) {
            activeCat = cat;
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            render();
            closeSidebars();
        }

        function setTheme(t, btn) {
            document.documentElement.setAttribute('data-theme', t);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            MuGolKayit.settings.saveTheme(t);
        }

        function adjFont(v) {
            if (v === 0) { fontSz = 20; }
            else { fontSz = Math.max(14, Math.min(32, fontSz + v)); }
            const well = document.getElementById('textWell');
            if (well) well.style.fontSize = fontSz + 'px';
            MuGolKayit.settings.saveFontSize(fontSz);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2400);
        }

        // ──────────────── RESTORE THEME ────────────────
        function restoreTheme() {
            const t = MuGolKayit.settings.getTheme();
            document.documentElement.setAttribute('data-theme', t);
            const map = { light: 'aydın', dark: 'karanlık', sepia: 'sepya' };
            document.querySelectorAll('.theme-btn').forEach(b => {
                const txt = b.innerText.trim().toLowerCase();
                b.classList.toggle('active', txt.includes(map[t] || ''));
            });
        }

        // ──────────────── KEYBOARD SHORTCUTS ────────────────
        document.addEventListener('keydown', e => {
            const readerOpen = document.getElementById('reader').classList.contains('open');
            if (!readerOpen) return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowRight') skip(1);
            if (e.code === 'ArrowLeft') skip(-1);
            if (e.code === 'Escape') closeReader();
        });

        // ──────────────── İNDİRME ────────────────
        function downloadKayitJs() {
            // Mevcut tüm kullanıcı verilerini al
            const snapshot = {
                favorites : MuGolKayit.favorites.get(),
                progress  : MuGolKayit.progress.getAll(),
                readList  : MuGolKayit.read.list(),
                theme     : MuGolKayit.settings.getTheme(),
                fontSize  : MuGolKayit.settings.getFontSize(),
                speed     : MuGolKayit.settings.getSpeed(),
            };

            // Dosyayı fetch et, üstüne otomatik yükleyici blok ekle
            fetch('hikaye-kayit.js')
                .then(r => {
                    if (!r.ok) throw new Error();
                    return r.text();
                })
                .then(src => {
                    const loader = `/* === KAYITLI VERİLER — otomatik yüklenir === */
(function(){
    var d = ${JSON.stringify(snapshot, null, 2)};
    var map = {
        favorites : 'mugol_favorites',
        progress  : 'mugol_progress',
        readList  : 'mugol_readList',
        theme     : 'mugol_theme',
        fontSize  : 'mugol_fontSize',
        speed     : 'mugol_speed',
    };
    Object.keys(d).forEach(function(k){ localStorage.setItem(map[k], JSON.stringify(d[k])); });
    console.log('[hikaye-kayit] Veriler geri yüklendi:', new Date().toLocaleString('tr-TR'));
})();
/* ============================================ */

`;
                    const blob = new Blob([loader + src], { type: 'text/javascript' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'hikaye-kayit.js';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('📥 Verilerle birlikte indirildi!');
                })
                .catch(() => {
                    // fetch başarısız olursa (file:// protokolü vb.) sadece veri bloğunu indir
                    const blob = new Blob([`/* hikaye-kayit.js — sadece veri bloğu */
(function(){
    var d = ${JSON.stringify(snapshot, null, 2)};
    var map = {
        favorites : 'mugol_favorites',
        progress  : 'mugol_progress',
        readList  : 'mugol_readList',
        theme     : 'mugol_theme',
        fontSize  : 'mugol_fontSize',
        speed     : 'mugol_speed',
    };
    Object.keys(d).forEach(function(k){ localStorage.setItem(map[k], JSON.stringify(d[k])); });
    console.log('[hikaye-kayit] Veriler geri yüklendi.');
})();
`], { type: 'text/javascript' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'hikaye-kayit.js';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('📥 Veri bloğu indirildi!');
                });
        }

        window.onload = init;
    </script>
</body>
</html>
